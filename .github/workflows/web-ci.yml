name: Web CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Hardening tests
        run: npm run test:hardening

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Compliance copy scanner
        run: node scripts/verify-compliance-copy.mjs --self-test && node scripts/verify-compliance-copy.mjs

  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local stack
        run: supabase start

      - name: Apply migrations and seed from empty
        run: supabase db reset --local

      - name: Run pgTAP
        run: supabase test db

      - name: Set up Node.js for source and product gates
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install application dependencies
        working-directory: web
        run: npm ci

      - name: Source and product gates
        working-directory: web
        run: npm run test:gates

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
