name: Web CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Hardening tests
        run: npm run test:hardening

      - name: Compliance copy scanner
        run: node scripts/verify-compliance-copy.mjs --self-test && node scripts/verify-compliance-copy.mjs

  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local stack
        run: supabase start

      - name: Apply migrations and seed from empty
        run: supabase db reset --local

      - name: Run pgTAP
        run: supabase test db

      - name: Set up Node.js for source and product gates
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install application dependencies
        working-directory: web
        run: npm ci

      - name: Build application for local end-to-end tests
        working-directory: web
        env:
          FEATURE_REAL_AUTH: "1"
          FEATURE_TENANCY: "1"
        run: |
          eval "$(supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" npm run build

      - name: End-to-end tests against the local stack
        working-directory: web
        env:
          ADMIN_E2E: "1"
          MF_BILLING_E2E_LOG: ${{ runner.temp }}/mostfundable-e2e.log
          MF_TENANCY_MAIL_E2E: "1"
          REVENUE_E2E: "1"
        run: |
          status=0
          npm run test:e2e || status=$?
          if [ "$status" -ne 0 ] && [ -f "$MF_BILLING_E2E_LOG" ]; then
            tail -250 "$MF_BILLING_E2E_LOG"
          fi
          exit "$status"

      - name: Source and product gates
        working-directory: web
        run: npm run test:gates

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
